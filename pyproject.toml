[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "barrier-pricing"
version = "1.0.0"
description = "Up-and-out barrier call: closed form, Monte Carlo (discrete and Brownian bridge), binomial tree, Greeks and delta hedging."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Milan Kalajdzic" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbmake>=1.5", "ruff>=0.6", "ipykernel>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/barrier_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
